<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="items">
    <div class="item">01</div>
    <div class="item">02</div>
    <div class="item">03</div>
    <div class="item">04</div>
    <div class="item">05</div>
    <div class="item">06</div>
    <div class="item">07</div>
    <div class="item">08</div>
    <div class="item">09</div>
    <div class="item">10</div>
    <div class="item">11</div>
    <div class="item">12</div>
    <div class="item">13</div>
    <div class="item">14</div>
    <div class="item">15</div>
    <div class="item">16</div>
    <div class="item">17</div>
    <div class="item">18</div>
    <div class="item">19</div>
    <div class="item">20</div>
    <div class="item">21</div>
    <div class="item">22</div>
    <div class="item">23</div>
    <div class="item">24</div>
    <div class="item">25</div>
  </div>

<script>
  const container = document.querySelector('.items');
  const items = document.querySelectorAll('.item');

  let activeItem = null;
  let offsetX = 0;
  let offsetY = 0;

  // Convert grid layout into absolute positioning
  items.forEach(item => {
    const itemRect = item.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();

    item.style.position = 'absolute';
    item.style.left = itemRect.left - containerRect.left + container.scrollLeft + 'px';
    item.style.top = itemRect.top - containerRect.top + 'px';

    item.addEventListener('mousedown', (e) => {
      activeItem = item;
      container.classList.add('active');

      const rect = item.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;

      item.style.zIndex = 1000;
      e.preventDefault();
    });
  });

  document.addEventListener('mousemove', (e) => {
    if (!activeItem) return;

    const containerRect = container.getBoundingClientRect();

    let x = e.clientX - containerRect.left - offsetX + container.scrollLeft;
    let y = e.clientY - containerRect.top - offsetY;

    const maxX = container.scrollWidth - activeItem.offsetWidth;
    const maxY = container.clientHeight - activeItem.offsetHeight;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    activeItem.style.left = x + 'px';
    activeItem.style.top = y + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (activeItem) {
      activeItem.style.zIndex = 1;
    }
    activeItem = null;
    container.classList.remove('active');
  });
</script>

</body>
</html>
