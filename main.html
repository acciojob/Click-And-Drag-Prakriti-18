<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="items" style="height:800px; min-height:800px;">
  <div class="spacer"></div>

  <div class="item">01</div>
  <div class="item">02</div>
  <div class="item">03</div>
  <div class="item">04</div>
  <div class="item">05</div>
</div>

<script>
const container = document.querySelector('.items');
const items = document.querySelectorAll('.item');

let active = null;
let offsetX = 0;
let offsetY = 0;

items.forEach(item => {
  const r = item.getBoundingClientRect();
  const c = container.getBoundingClientRect();

  item.style.position = 'absolute';
  item.style.left = r.left - c.left + 'px';
  item.style.top = r.top - c.top + 'px';

  item.addEventListener('mousedown', e => {
    active = item;
    offsetX = e.clientX - r.left;
    offsetY = e.clientY - r.top;
    item.style.zIndex = 1000;
  });
});

document.addEventListener('mousemove', e => {
  if (!active) return;

  const c = container.getBoundingClientRect();
  let x = e.clientX - c.left - offsetX;
  let y = e.clientY - c.top - offsetY;

  x = Math.max(0, Math.min(x, container.clientWidth - active.offsetWidth));
  y = Math.max(0, Math.min(y, container.clientHeight - active.offsetHeight));

  active.style.left = x + 'px';
  active.style.top = y + 'px';
});

document.addEventListener('mouseup', () => {
  active = null;
});
</script>

</body>
</html>
