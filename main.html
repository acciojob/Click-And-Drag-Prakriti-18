<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="items" style="height:800px; min-height:800px;">
  <div class="spacer"></div>

  <div class="item">01</div>
  <div class="item">02</div>
  <div class="item">03</div>
  <div class="item">04</div>
  <div class="item">05</div>
</div>

<script>
  const container = document.querySelector('.items');
  const items = document.querySelectorAll('.item');

  let activeItem = null;
  let startX = 0;
  let startY = 0;
  let initialLeft = 0;
  let initialTop = 0;

  items.forEach(item => {
    const r = item.getBoundingClientRect();
    const c = container.getBoundingClientRect();

    item.style.position = 'absolute';
    item.style.left = (r.left - c.left) + 'px';
    item.style.top = (r.top - c.top) + 'px';

    item.addEventListener('mousedown', e => {
      activeItem = item;

      startX = e.clientX;
      startY = e.clientY;

      initialLeft = parseInt(item.style.left);
      initialTop = parseInt(item.style.top);
    });
  });

  container.addEventListener('mousemove', e => {
    if (!activeItem) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    let newLeft = initialLeft + dx;
    let newTop = initialTop + dy;

    newLeft = Math.max(0, Math.min(newLeft, container.clientWidth - activeItem.offsetWidth));
    newTop = Math.max(0, Math.min(newTop, container.clientHeight - activeItem.offsetHeight));

    activeItem.style.left = newLeft + 'px';
    activeItem.style.top = newTop + 'px';
  });

  container.addEventListener('mouseup', () => {
    activeItem = null;
  });

  container.addEventListener('mouseleave', () => {
    activeItem = null;
  });
</script>


</body>
</html>
